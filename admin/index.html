<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PetShop Chile - Panel de administrador</title>
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body class="cuerpo-admin">
        <!-- menu lateral del panel -->
        <aside class="menu-admin">
            <div class="logo-admin">PetShop Chile</div>

            <nav>
                <ul class="lista-admin">
                    <li id="opcion-dashboard" class="opcion-admin">
                        <a href="index.html" aria-current="page">Dashboard</a>
                    </li>
                    <li id="opcion-productos" class="opcion-admin">
                        <a href="productos.html">Productos</a>
                    </li>
                    <li id="opcion-usuarios" class="opcion-admin">
                        <a href="usuarios.html">Usuarios</a>
                    </li>
                    <li id="opcion-tienda" class="opcion-admin">
                        <a href="../index.html">Volver a la tienda</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- contenido principal del panel -->
        <main class="contenido-admin">
            <div class="encabezado-admin">
                <h1 class="titulo-admin">¡Hola, Administrador!</h1>
            </div>

            <!-- tarjetas de resumen del panel -->
            <section class="tarjetas-admin">
                <article class="tarjeta-admin">
                    <h2 class="titulo-tarjeta-admin">Productos</h2>
                    <p class="numero-tarjeta-admin">8</p>
                </article>

                <article class="tarjeta-admin">
                    <h2 class="titulo-tarjeta-admin">Usuarios</h2>
                    <p class="numero-tarjeta-admin">3</p>
                </article>
            </section>
        </main>
    </body>
</html>
