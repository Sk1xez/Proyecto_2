<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PetShop Chile - Nuevo usuario</title>
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="../css/admin.css">
        <script src="../js/usuarios.js"></script>
        <script src="../js/sesion.js"></script>
        <script src="../js/proteger-admin.js"></script>
        <script src="../js/adaptar-panel.js"></script>
    </head>
    <body class="cuerpo-admin">
        <!-- menu lateral del panel -->
        <aside class="menu-admin">
            <div class="logo-admin">PetShop Chile</div>

            <nav>
                <ul class="lista-admin">
                    <li id="opcion-dashboard" class="opcion-admin">
                        <a href="index.html">Dashboard</a>
                    </li>
                    <li id="opcion-productos" class="opcion-admin">
                        <a href="productos.html">Productos</a>
                    </li>
                    <li id="opcion-usuarios" class="opcion-admin">
                        <a href="usuarios.html" aria-current="page">Usuarios</a>
                    </li>
                    <li id="opcion-tienda" class="opcion-admin">
                        <a href="../index.html">Volver a la tienda</a>
                    </li>
                    <li id="opcion-cerrar-sesion" class="opcion-admin">
                        <a href="#" id="enlace-cerrar-sesion">Cerrar sesión</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- contenido principal del panel -->
        <main class="contenido-admin">
            <div class="encabezado-pagina">
                <h1 class="titulo-admin">Nuevo usuario</h1>
            </div>

            <!-- formulario de nuevo usuario -->
            <form action="#" method="POST" class="formulario-producto" id="form-usuario" novalidate>
                <div class="tarjeta-formulario">
                    <fieldset class="grupo-formulario">
                        <legend class="leyenda-formulario">Datos personales</legend>

                        <div class="fila-dos-campos">
                            <div class="grupo-campo">
                                <label for="run" class="etiqueta-campo">RUN:</label>
                                <input type="text" id="run" name="run" class="entrada-campo" autocomplete="off" minlength="7" maxlength="9" placeholder="Ej: 19011022K" required>
                                <p class="mensaje-error" id="error-run"></p>
                            </div>

                            <div class="grupo-campo">
                                <label for="nombre" class="etiqueta-campo">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" class="entrada-campo" autocomplete="given-name" maxlength="50" placeholder="Ej: María" required>
                                <p class="mensaje-error" id="error-nombre"></p>
                            </div>
                        </div>

                        <div class="fila-dos-campos">
                            <div class="grupo-campo">
                                <label for="apellidos" class="etiqueta-campo">Apellidos:</label>
                                <input type="text" id="apellidos" name="apellidos" class="entrada-campo" autocomplete="family-name" maxlength="100" placeholder="Ej: González" required>
                                <p class="mensaje-error" id="error-apellidos"></p>
                            </div>

                            <div class="grupo-campo">
                                <label for="correo" class="etiqueta-campo">Correo:</label>
                                <input type="email" id="correo" name="correo" class="entrada-campo" autocomplete="email" maxlength="100" placeholder="tucorreo@duocuc.cl" required>
                                <p class="mensaje-error" id="error-correo"></p>
                            </div>
                        </div>

                        <div class="fila-dos-campos">
                            <div class="grupo-campo">
                                <label for="fecha-nacimiento" class="etiqueta-campo">Fecha de nacimiento:</label>
                                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" class="entrada-campo" autocomplete="bday">
                                <p class="mensaje-error" id="error-fecha-nacimiento"></p>
                            </div>

                            <div class="grupo-campo">
                                <label for="tipo-usuario" class="etiqueta-campo">Tipo de usuario:</label>
                                <select id="tipo-usuario" name="tipo-usuario" class="entrada-campo" required>
                                    <option value="" disabled selected>Seleccione el tipo</option>
                                    <option value="administrador">Administrador</option>
                                    <option value="vendedor">Vendedor</option>
                                    <option value="cliente">Cliente</option>
                                </select>
                                <p class="mensaje-error" id="error-tipo-usuario"></p>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="grupo-formulario">
                        <legend class="leyenda-formulario">Contraseña</legend>

                        <div class="fila-dos-campos">
                            <div class="grupo-campo">
                                <label for="contrasena" class="etiqueta-campo">Contraseña:</label>
                                <input type="password" id="contrasena" name="contrasena" class="entrada-campo" autocomplete="new-password" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres" required>
                                <p class="mensaje-error" id="error-contrasena"></p>
                            </div>

                            <div class="grupo-campo">
                                <label for="confirmar-contrasena" class="etiqueta-campo">Confirmar contraseña:</label>
                                <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" class="entrada-campo" autocomplete="new-password" placeholder="Repite la contraseña" required>
                                <p class="mensaje-error" id="error-confirmar-contrasena"></p>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="grupo-formulario">
                        <legend class="leyenda-formulario">Ubicación</legend>

                        <div class="fila-dos-campos">
                            <div class="grupo-campo">
                                <label for="region" class="etiqueta-campo">Región:</label>
                                <select id="region" name="region" class="entrada-campo" required>
                                    <option value="" selected>Seleccione la región</option>
                                </select>
                                <p class="mensaje-error" id="error-region"></p>
                            </div>

                            <div class="grupo-campo">
                                <label for="comuna" class="etiqueta-campo">Comuna:</label>
                                <select id="comuna" name="comuna" class="entrada-campo" required>
                                    <option value="" selected>Seleccione la comuna</option>
                                </select>
                                <p class="mensaje-error" id="error-comuna"></p>
                            </div>
                        </div>

                        <div class="grupo-campo">
                            <label for="direccion" class="etiqueta-campo">Dirección:</label>
                            <input type="text" id="direccion" name="direccion" class="entrada-campo" autocomplete="street-address" maxlength="300" placeholder="Calle, número, departamento" required>
                            <p class="mensaje-error" id="error-direccion"></p>
                        </div>
                    </fieldset>

                    <div class="acciones-formulario">
                        <button type="submit" class="boton-admin-principal">Guardar</button>
                        <a href="usuarios.html" class="boton-admin-secundario">Cancelar</a>
                    </div>
                </div>
            </form>

            <p class="mensaje-exito" id="resultado-usuario" hidden>Usuario guardado correctamente.</p>
        </main>

        <script src="../js/regiones.js" defer></script>
        <script src="../js/validaciones.js" defer></script>
    </body>
</html>
