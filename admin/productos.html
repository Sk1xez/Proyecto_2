<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PetShop Chile - Productos</title>
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="../css/admin.css">
        <script src="../js/usuarios.js"></script>
        <script src="../js/sesion.js"></script>
        <script src="../js/proteger-admin.js"></script>
    </head>
    <body class="cuerpo-admin">
        <!-- menu lateral del panel -->
        <aside class="menu-admin">
            <div class="logo-admin">PetShop Chile</div>

            <nav>
                <ul class="lista-admin">
                    <li id="opcion-dashboard" class="opcion-admin">
                        <a href="index.html">Dashboard</a>
                    </li>
                    <li id="opcion-productos" class="opcion-admin">
                        <a href="productos.html" aria-current="page">Productos</a>
                    </li>
                    <li id="opcion-usuarios" class="opcion-admin">
                        <a href="usuarios.html">Usuarios</a>
                    </li>
                    <li id="opcion-tienda" class="opcion-admin">
                        <a href="../index.html">Volver a la tienda</a>
                    </li>
                    <li id="opcion-cerrar-sesion" class="opcion-admin">
                        <a href="#" id="enlace-cerrar-sesion">Cerrar sesión</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- contenido principal del panel -->
        <main class="contenido-admin">
            <div class="encabezado-pagina">
                <h1 class="titulo-admin">Productos</h1>
                <a href="producto-nuevo.html" class="boton-admin-principal">Nuevo producto</a>
            </div>

            <!-- tabla de productos del panel -->
            <div class="tabla-contenedor">
                <table class="tabla-admin">
                    <caption>Listado de productos</caption>
                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </main>

        <script src="../js/productos.js" defer></script>
    </body>
</html>
