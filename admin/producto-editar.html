<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PetShop Chile - Editar producto</title>
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="../css/admin.css">
        <script src="../js/usuarios.js"></script>
        <script src="../js/sesion.js"></script>
        <script src="../js/proteger-admin.js"></script>
    </head>
    <body class="cuerpo-admin">
        <!-- menu lateral del panel -->
        <aside class="menu-admin">
            <div class="logo-admin">PetShop Chile</div>

            <nav>
                <ul class="lista-admin">
                    <li id="opcion-dashboard" class="opcion-admin">
                        <a href="index.html">Dashboard</a>
                    </li>
                    <li id="opcion-productos" class="opcion-admin">
                        <a href="productos.html" aria-current="page">Productos</a>
                    </li>
                    <li id="opcion-usuarios" class="opcion-admin">
                        <a href="usuarios.html">Usuarios</a>
                    </li>
                    <li id="opcion-tienda" class="opcion-admin">
                        <a href="../index.html">Volver a la tienda</a>
                    </li>
                    <li id="opcion-cerrar-sesion" class="opcion-admin">
                        <a href="#" id="enlace-cerrar-sesion">Cerrar sesión</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- contenido principal del panel -->
        <main class="contenido-admin">
            <div class="encabezado-pagina">
                <h1 class="titulo-admin">Editar producto</h1>
            </div>

            <p class="alerta-stock" id="alerta-stock" hidden></p>

            <!-- formulario de edicion de producto -->
            <form action="#" method="POST" class="formulario-producto" id="form-producto" novalidate>
                <div class="tarjeta-formulario">
                    <div class="fila-dos-campos">
                        <div class="grupo-campo">
                            <label for="codigo" class="etiqueta-campo">Código:</label>
                            <input type="text" id="codigo" name="codigo" class="entrada-campo" minlength="3" required>
                            <p class="mensaje-error" id="error-codigo"></p>
                        </div>

                        <div class="grupo-campo">
                            <label for="nombre" class="etiqueta-campo">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" class="entrada-campo" maxlength="100" required>
                            <p class="mensaje-error" id="error-nombre"></p>
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="descripcion" class="etiqueta-campo">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4" class="entrada-campo area-texto" maxlength="500"></textarea>
                        <p class="mensaje-error" id="error-descripcion"></p>
                        <p class="contador-campo" id="contador-descripcion">0/500</p>
                    </div>

                    <div class="fila-dos-campos">
                        <div class="grupo-campo">
                            <label for="precio" class="etiqueta-campo">Precio:</label>
                            <input type="number" id="precio" name="precio" class="entrada-campo" min="0" step="0.01" required>
                            <p class="mensaje-error" id="error-precio"></p>
                        </div>

                        <div class="grupo-campo">
                            <label for="stock" class="etiqueta-campo">Stock:</label>
                            <input type="number" id="stock" name="stock" class="entrada-campo" min="0" step="1" required>
                            <p class="mensaje-error" id="error-stock"></p>
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="stock-critico" class="etiqueta-campo">Stock crítico:</label>
                        <input type="number" id="stock-critico" name="stock-critico" class="entrada-campo" min="0" step="1">
                        <p class="mensaje-error" id="error-stock-critico"></p>
                    </div>

                    <div class="grupo-campo">
                        <label for="categoria" class="etiqueta-campo">Categoría:</label>
                        <select id="categoria" name="categoria" class="entrada-campo" required>
                            <option value="" disabled selected>Seleccione una categoría</option>
                            <option value="alimentos">Alimentos</option>
                            <option value="juguetes">Juguetes</option>
                            <option value="accesorios">Accesorios</option>
                            <option value="higiene">Higiene</option>
                        </select>
                        <p class="mensaje-error" id="error-categoria"></p>
                    </div>

                    <div class="grupo-campo">
                        <label for="imagen" class="etiqueta-campo">Imagen:</label>
                        <input type="file" id="imagen" name="imagen" class="entrada-campo" accept="image/*">
                        <p class="mensaje-error" id="error-imagen"></p>
                    </div>

                    <div class="acciones-formulario">
                        <button type="submit" class="boton-admin-principal">Guardar cambios</button>
                        <a href="productos.html" class="boton-admin-secundario">Cancelar</a>
                    </div>
                </div>
            </form>

            <p class="mensaje-exito" id="resultado-producto" hidden>Producto guardado correctamente.</p>
        </main>

        <script src="../js/validaciones.js" defer></script>
        <script src="../js/productos.js" defer></script>
    </body>
</html>
